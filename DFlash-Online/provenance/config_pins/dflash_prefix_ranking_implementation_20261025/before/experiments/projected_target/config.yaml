  num_anchors: 64
  objective_chunk_blocks: 8
  loss_type: dflash
  lk_loss_type: null
  loss_decay_gamma: 7.0
  log_interval: 1
  dist_timeout: 30
  seed: 17
tracking:
  report_to: none
