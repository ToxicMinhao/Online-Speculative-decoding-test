# Fixed eight-step feasibility event; C/P share this recipe.
model:
  target_model_path: /data/sources/minhao/models/qwen3_dflash_foundation_20261022/target
  draft_model_config: /data/sources/minhao/models/qwen3_dflash_foundation_20261022/draft
  draft_checkpoint_path: /data/sources/minhao/models/qwen3_dflash_foundation_20261022/draft
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
