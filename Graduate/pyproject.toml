[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graduate-dflash"
version = "0.1.0"
description = "Readable online DFlash adaptation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
training = ["torch==2.13.0", "transformers==5.12.1", "safetensors==0.8.0", "numpy==2.3.5"]
# SpecForge is installed from the pinned author checkout documented in README.

[project.scripts]
graduate = "graduate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
